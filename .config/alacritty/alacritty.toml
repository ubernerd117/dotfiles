
[general]
# Live config reload — pick up changes to this file without a restart.
live_config_reload = true
# Alacritty configuration
# Schema: Alacritty 0.13+ (TOML). See `man 5 alacritty` or
# https://alacritty.org/config-alacritty.html for the full reference.

# Active color theme. Swap themes by changing this single path — available
# options live in ~/.config/alacritty/themes/ (catppuccin_mocha, tokyo_night,
# gruvbox_dark, one_dark, nord, solarized_dark, dracula). Imports are applied
# in order; anything set below in this file overrides them.
import = [
  "~/.config/alacritty/themes/dracula.toml",
]

[env]
# Ensure programs detect 256-color + truecolor support.
TERM = "xterm-256color"

# -----------------------------------------------------------------------------
# Window
# -----------------------------------------------------------------------------
[window]
# Spawn the window with these dimensions (changes after launch are not tracked).
dimensions = { columns = 120, lines = 32 }

# Blank space around the terminal grid, in pixels.
padding = { x = 10, y = 10 }

# Spread additional padding evenly so the grid stays centered.
dynamic_padding = true

# Window decorations: "Full", "None", "Transparent" (macOS), "Buttonless" (macOS).
decorations = "Buttonless"

# 0.0 = fully transparent, 1.0 = fully opaque.
opacity = 0.97

# Blur the content behind a transparent window (macOS / KDE).
blur = true

# Let the title bar / window theme follow the OS appearance.
decorations_theme_variant = "Dark"

# Window title and dynamic title from the running program.
title = "Alacritty"
dynamic_title = true

# Startup mode: "Windowed", "Maximized", "Fullscreen", "SimpleFullscreen" (macOS).
startup_mode = "Windowed"

# Option key behaves as Alt so terminal apps receive meta keys (macOS).
option_as_alt = "Both"

# -----------------------------------------------------------------------------
# Scrolling
# -----------------------------------------------------------------------------
[scrolling]
# Lines kept in the scrollback buffer.
history = 10000

# Lines scrolled per tick when using the scroll wheel.
multiplier = 3

# -----------------------------------------------------------------------------
# Font
# -----------------------------------------------------------------------------
[font]
size = 14.0

normal      = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold        = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic      = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

# Nudge glyph positioning if your font sits slightly off.
offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }

# Render the box-drawing/block characters with Alacritty's built-in glyphs.
# builtin_box_drawing = true

# -----------------------------------------------------------------------------
# Cursor
# -----------------------------------------------------------------------------
[cursor]
# style.shape: "Block", "Underline", "Beam". style.blinking: "Never",
# "Off", "On", "Always".
style = { shape = "Block", blinking = "On" }
blink_interval = 600
unfocused_hollow = true
thickness = 0.15

# -----------------------------------------------------------------------------
# Mouse / selection
# -----------------------------------------------------------------------------
[mouse]
hide_when_typing = true

[selection]
# Characters treated as separators for semantic (double-click) selection.
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
# Leave false on macOS: copying every selection to the system clipboard makes
# NSPasteboard intermittently reject writes ("writeObjects: returned false"),
# especially alongside a clipboard manager. Use Cmd+C to copy explicitly.
save_to_clipboard = false

# Colors are supplied by the imported theme at the top of this file. To
# override a single color regardless of the active theme, add a [colors.*]
# table here — it wins over the import.

# -----------------------------------------------------------------------------
# Bell
# -----------------------------------------------------------------------------
[bell]
animation = "EaseOutExpo"
duration = 0          # 0 disables the visual bell
color = "#cdd6f4"

# -----------------------------------------------------------------------------
# Keyboard
# -----------------------------------------------------------------------------
[keyboard]
bindings = [
  # Font size
{ key = "Equals",   mods = "Command", action = "IncreaseFontSize" },
  { key = "Minus",    mods = "Command", action = "DecreaseFontSize" },
  { key = "Key0",     mods = "Command", action = "ResetFontSize" },

  # Clipboard
  { key = "C",        mods = "Command", action = "Copy" },
  { key = "V",        mods = "Command", action = "Paste" },

  # Window / search
  { key = "N",        mods = "Command", action = "CreateNewWindow" },
  { key = "F",        mods = "Command", action = "SearchForward" },
  { key = "B",        mods = "Command", action = "SearchBackward" },
  { key = "Return",   mods = "Command", action = "ToggleSimpleFullscreen" },

  # Scrolling
  { key = "K",        mods = "Command", action = "ClearHistory" },
  { key = "PageUp",   mods = "Shift",   action = "ScrollPageUp" },
  { key = "PageDown", mods = "Shift",   action = "ScrollPageDown" },
  { key = "Home",     mods = "Shift",   action = "ScrollToTop" },
  { key = "End",      mods = "Shift",   action = "ScrollToBottom" },
]

[terminal.shell]
program = "tmux"
args= ["new-session", "-A", "-s", "main"]
